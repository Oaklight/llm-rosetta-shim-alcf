[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-rosetta-shim-alcf"
dynamic = ["version"]
description = "ALCF (Argonne) provider shims for llm-rosetta, delivered as a plugin package"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Oaklight" }]
keywords = ["llm", "llm-rosetta", "shim", "alcf", "provider"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
]
# ``connection.token_command`` lands in 0.14; an older core silently ignores
# the key, so the floor is what makes the shipped exchange actually run.
dependencies = ["llm-rosetta>=0.14.0.dev0"]

[project.urls]
Repository = "https://github.com/Oaklight/llm-rosetta-shim-alcf"
Upstream = "https://github.com/Oaklight/llm-rosetta"

[project.entry-points."llm_rosetta.shim_providers"]
alcf = "llm_rosetta_shim_alcf:register_shims"

[tool.setuptools.dynamic]
version = { attr = "llm_rosetta_shim_alcf.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_rosetta_shim_alcf = ["providers/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
